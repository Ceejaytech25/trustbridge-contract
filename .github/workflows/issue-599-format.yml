name: Format Issue 599 Rust test
on:
  push:
    branches: [test/599-expand-upgrade-rbac-xdr-fixtures]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/599-expand-upgrade-rbac-xdr-fixtures
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit Rust formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/generate_xdr_fixtures.rs
          if ! git diff --cached --quiet; then
            git commit -m "style(test): format Issue 599 XDR generator"
            git push
          fi
