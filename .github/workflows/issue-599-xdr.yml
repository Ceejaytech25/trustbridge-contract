name: Issue 599 XDR fixture generation
on:
  push:
    branches:
      - test/599-expand-upgrade-rbac-xdr-fixtures
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    if: "!contains(github.event.head_commit.message, '[generated-xdr]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate actual Rust XDR fixture blocks
        run: |
          make xdr-fixtures 2>&1 | tee /tmp/fixture-output.log
      - name: Write generated fixture pairs
        run: |
          python3 - <<'PY'
          import pathlib, re
          raw = pathlib.Path('/tmp/fixture-output.log').read_text()
          target = pathlib.Path('ts-differential-tests/fixtures')
          names = [
              'upgraded_event', 'role_granted_event', 'role_revoked_event',
              'upgrade_proposed_event', 'upgrade_approved_event',
              'upgrade_proposal_executed_event', 'upgrade_proposal_cancelled_event'
          ]
          for name in names:
              marker = re.search(
                  r'--- ' + name + r'\.xdr ---\s*([^\r\n]+)\s*--- ' +
                  name + r'\.meta\.json ---\s*([^\r\n]+)', raw)
              if not marker:
                  raise SystemExit(f'Expected generated XDR fixture missing: {name}')
              (target / (name + '.xdr')).write_text(marker.group(1).strip() + '\n')
              (target / (name + '.meta.json')).write_text(marker.group(2).strip() + '\n')
          PY
      - name: Run TypeScript differential tests
        run: make diff-test
      - name: Commit generated fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ts-differential-tests/fixtures/*.xdr ts-differential-tests/fixtures/*.meta.json
          if ! git diff --cached --quiet; then
            git commit -m "test(xdr): commit generated upgrade and RBAC fixtures [generated-xdr]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-599-generator-log
          path: /tmp/fixture-output.log
